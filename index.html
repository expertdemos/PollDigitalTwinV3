<body>
<div id="app"></div>
<div id="toast"><span class="dot"></span><span id="toast-msg"></span></div>
<script>
"use strict";
/* Urban Environment Twin — Air Quality · v3
   Data agent aware: tries ./data/<city>.json first (published by the GitHub
   Actions agent), then falls back to direct Open-Meteo, then to sample data. */
const AGENT_DATA_DIR = "./data";

const ICONS={

function naqiSub(pol,c){ const bp=NAQI_BP[pol]; if(c==null)return null; for(const b of bp){const[cl,ch,il,ih]=b; if(c>=cl&&c<=ch)return Math.round(((ih-il)/(ch-cl))*(c-cl)+il);} const last=bp[bp.length-1]; return c>last[1]?500:Math.round(last[2]); }
function bandForConc(pol,c,standard){
  if(c==null)return{idx:0,name:standard==='india'?NAQI_NAMES[0]:EEA_NAMES[0],hex:RAMP[0],cls:RAMP_CLS[0]};
  if(standard!=='india'){ const t=EEA_BP[pol]; let idx=t.findIndex(x=>c<=x); if(idx<0)idx=5; return{idx,name:EEA_NAMES[idx],hex:RAMP[idx],cls:RAMP_CLS[idx]}; }
  const aqi=naqiSub(pol,c); let idx=aqi<=50?0:aqi<=100?1:aqi<=200?2:aqi<=300?3:aqi<=400?4:5; return{idx,name:NAQI_NAMES[idx],hex:RAMP[idx],cls:RAMP_CLS[idx]};
}

];

function cityBBox(city){ const pts=city.stations.concat(city.receptors); let laMin=Infinity,laMax=-Infinity,loMin=Infinity,loMax=-Infinity; pts.forEach(p=>{laMin=Math.min(laMin,p.lat);laMax=Math.max(laMax,p.lat);loMin=Math.min(loMin,p.lon);loMax=Math.max(loMax,p.lon);}); const padLa=(laMax-laMin)*0.12+0.004, padLo=(loMax-loMin)*0.12+0.004; return {latMin:laMin-padLa,latMax:laMax+padLa,lonMin:loMin-padLo,lonMax:loMax+padLo}; }
function project(lat,lon){ const b=state.city.bbox; const x=(lon-b.lonMin)/(b.lonMax-b.lonMin)*100; const y=(b.latMax-lat)/(b.latMax-b.latMin)*100; return {x,y}; }
const DIURNAL=[1.18,1.22,1.20,1.12,1.02,1.05,1.20,1.34,1.40,1.20,1.02,0.92,0.86,0.82,0.80,0.84,0.94,1.10,1.28,1.34,1.30,1.28,1.24,1.20];
function diurnalMul(h){ return DIURNAL[((h%24)+24)%24]; }
const POL_REL={pm25:1,pm10:1.9,no2:0.55,o3:0.42,so2:0.14,co:7};

const state={ screen:"selector", city:null, cityId:null, dataMode:"sample", dataSource:null, live:null, liveError:null, pollutant:"pm25", hour:new Date().getHours(), showStations:true, showReceptors:true, showSurface:true, weather:{windDir:245,windSpeed:9,temp:24,humidity:55}, scenario:{traffic:0,construction:0,industrial:0,lez:false,ebus:0,windDir:245,windSpeed:9}, selectedStation:null, notes:"" };

/* ============================ DATA LOADERS ============================ */
function omAqUrl(city){ const lat=city.stations.map(s=>s.lat).join(','), lon=city.stations.map(s=>s.lon).join(','); return "https://air-quality-api.open-meteo.com/v1/air-quality?latitude="+lat+"&longitude="+lon+"&current=pm2_5,pm10,nitrogen_dioxide,sulphur_dioxide,ozone,carbon_monoxide,european_aqi&timezone=auto"; }
function omHourlyUrl(city){ return "https://air-quality-api.open-meteo.com/v1/air-quality?latitude="+city.center.lat+"&longitude="+city.center.lon+"&hourly=pm2_5,pm10,nitrogen_dioxide,sulphur_dioxide,ozone,carbon_monoxide&past_days=1&forecast_days=1&timezone=auto"; }
function omWxUrl(city){ return "https://api.open-meteo.com/v1/forecast?latitude="+city.center.lat+"&longitude="+city.center.lon+"&current=wind_speed_10m,wind_direction_10m,temperature_2m,relative_humidity_2m&timezone=auto"; }
function hourlyNowIdx(times){ const now=Date.now(); let idx=0,best=Infinity; times.forEach((t,i)=>{const d=Math.abs(new Date(t).getTime()-now); if(d<best){best=d;idx=i;}}); return idx; }
async function tryAgent(city){
  const res=await fetch(AGENT_DATA_DIR+"/"+city.id+".json",{cache:"no-store"});
  if(!res.ok) throw new Error("no agent file ("+res.status+")");
  const d=await res.json();
  if(!d||!d.ok||!Array.isArray(d.stations)) throw new Error("agent file not ok");
  city.stations.forEach((st,i)=>{ const a=d.stations[i]; st.live=a?{pm25:a.pm25,pm10:a.pm10,no2:a.no2,o3:a.o3,so2:a.so2,co:a.co,european_aqi:a.european_aqi}:null; });
  const good=city.stations.filter(s=>s.live&&s.live.pm25!=null).length;
  if(good<Math.ceil(city.stations.length/2)) throw new Error("agent: insufficient stations");
  if(d.weather&&d.weather.windDir!=null){ state.weather=d.weather; state.scenario.windDir=d.weather.windDir; state.scenario.windSpeed=d.weather.windSpeed; }
  let series=null;
  if(d.hourly&&d.hourly.time){ const t=d.hourly.time; series={time:t,nowIdx:hourlyNowIdx(t),data:{pm25:d.hourly.pm25,pm10:d.hourly.pm10,no2:d.hourly.no2,o3:d.hourly.o3,so2:d.hourly.so2,co:d.hourly.co}}; }
  state.live={fetchedAt:d.fetchedAt?new Date(d.fetchedAt).getTime():Date.now(),series,agent:true};
  state.dataMode="live"; state.dataSource=(d.source&&d.source.indexOf('waqi')>=0)?"agent+waqi":"agent"; return true;
}
async function tryDirect(city){
  const [aqR,hrR,wxR]=await Promise.all([fetch(omAqUrl(city)),fetch(omHourlyUrl(city)),fetch(omWxUrl(city))]);
  if(!aqR.ok) throw new Error("AQ HTTP "+aqR.status);
  const arr=await aqR.json(); const list=Array.isArray(arr)?arr:[arr];
  city.stations.forEach((st,i)=>{ const r=list[i]; if(!r||!r.current){st.live=null;return;} const c=r.current; st.live={pm25:c.pm2_5,pm10:c.pm10,no2:c.nitrogen_dioxide,o3:c.ozone,so2:c.sulphur_dioxide,co:c.carbon_monoxide,european_aqi:c.european_aqi}; });
  const good=city.stations.filter(s=>s.live&&s.live.pm25!=null).length;
  if(good<Math.ceil(city.stations.length/2)) throw new Error("direct: insufficient stations");
  let series=null; try{ const hj=await hrR.json(); if(hj.hourly&&hj.hourly.time){ const h=hj.hourly; series={time:h.time,nowIdx:hourlyNowIdx(h.time),data:{pm25:h.pm2_5,pm10:h.pm10,no2:h.nitrogen_dioxide,o3:h.ozone,so2:h.sulphur_dioxide,co:h.carbon_monoxide}}; } }catch(e){}
  try{ const wj=await wxR.json(); const c=wj.current||{}; if(c.wind_direction_10m!=null){ state.weather={windDir:c.wind_direction_10m,windSpeed:Math.round(c.wind_speed_10m),temp:Math.round(c.temperature_2m),humidity:Math.round(c.relative_humidity_2m)}; state.scenario.windDir=state.weather.windDir; state.scenario.windSpeed=state.weather.windSpeed; } }catch(e){}
  state.live={fetchedAt:Date.now(),series,agent:false}; state.dataMode="live"; state.dataSource="open-meteo"; return true;
}
async function loadLiveData(city){
  state.liveError=null;
  try{ await tryAgent(city); return true; }catch(eAgent){
    try{ await tryDirect(city); return true; }catch(eDirect){
      state.liveError=(eDirect&&eDirect.message)||"fetch failed"; state.dataMode="sample"; state.dataSource=null; city.stations.forEach(s=>s.live=null); state.live=null; return false;
    }
  }
}

/* ============================ TWIN ENGINE ============================ */
function compFromSplit(st,pm){ const[t,i,c,b]=st.split.map(f=>f*pm); return{traffic:t,industrial:i,construction:c,background:b}; }
function applyScen(comp,scen){ let{traffic:tr,industrial:ind,construction:con,background:bg}=comp; if(scen){ tr*=(1-(scen.traffic||0)/100); tr*=(1-0.35*(scen.ebus||0)/100); con*=(1-(scen.construction||0)/100); ind*=(1-(scen.industrial||0)/100); if(scen.lez)tr*=0.6; } return{pm:tr+ind+con+bg,comp:{traffic:tr,industrial:ind,construction:con,background:bg}}; }
function samplePM25(st,hour,scen){ const d=diurnalMul(hour); let[tr,ind,con,bg]=st.split.map(f=>f*st.base); tr*=(0.6+0.4*d*1.15); con*=(0.8+0.2*d); bg*=(0.85+0.15*d); return applyScen({traffic:tr,industrial:ind,construction:con,background:bg},scen); }
function nodeValues(scen){ const city=state.city, pol=state.pollutant, rel=POL_REL[pol]; return city.stations.map(st=>{ let pm,comp,value; if(state.dataMode==='live'&&st.live&&st.live.pm25!=null){ const basePm=st.live.pm25, baseComp=compFromSplit(st,basePm), sc=applyScen(baseComp,scen); pm=sc.pm; comp=sc.comp; let baseVal=st.live[pol]!=null?st.live[pol]:basePm*rel; const ratio=basePm>0?pm/basePm:1; value=scen?baseVal*ratio:baseVal; }else{ const r=samplePM25(st,state.hour,scen); pm=r.pm; comp=r.comp; value=r.pm*rel; } return {st,pm25:pm,comp,value,p:project(st.lat,st.lon)}; }); }
function windVector(scen){ const dir=(scen&&scen.windDir!=null)?scen.windDir:state.weather.windDir; const spd=(scen&&scen.windSpeed!=null)?scen.windSpeed:state.weather.windSpeed; const towards=(dir+180)*Math.PI/180; const mag=Math.min(3.2,(spd||0)*0.16); return {dx:Math.sin(towards)*mag,dy:-Math.cos(towards)*mag,spd:spd||0}; }
function interpolate(nodes,scen,gx,gy){ const wv=windVector(scen); const disp=1+(wv.spd-9)*0.03; const cells=[]; for(let j=0;j<gy;j++)for(let i=0;i<gx;i++){ const x=(i+0.5)/gx*100,y=(j+0.5)/gy*100; let num=0,den=0; nodes.forEach(n=>{const sx=n.p.x+wv.dx,sy=n.p.y+wv.dy; let d2=(x-sx)**2+(y-sy)**2; if(d2<1.2)d2=1.2; const w=1/Math.pow(d2,1.35); num+=w*n.value; den+=w;}); cells.push({x,y,v:(den?num/den:0)/disp}); } return cells; }
function sampleAt(lat,lon,nodes,scen){ const wv=windVector(scen); const p=project(lat,lon); let num=0,den=0; nodes.forEach(n=>{const sx=n.p.x+wv.dx,sy=n.p.y+wv.dy; let d2=(p.x-sx)**2+(p.y-sy)**2; if(d2<1.2)d2=1.2; const w=1/Math.pow(d2,1.35); num+=w*n.value; den+=w;}); const disp=1+(wv.spd-9)*0.03; return den?(num/den)/disp:0; }
function cityAvg(nodes){ return nodes.reduce((a,n)=>a+n.value,0)/nodes.length; }
function cityMedian(nodes){ const v=nodes.map(n=>n.value).sort((a,b)=>a-b); const m=Math.floor(v.length/2); return v.length%2?v[m]:(v[m-1]+v[m])/2; }
function citySeries(scen){ const pol=state.pollutant; if(state.dataMode==='live'&&state.live&&state.live.series){ const s=state.live.series,arr=s.data[pol]||[],t=s.time,nowIdx=s.nowIdx,out=[]; for(let k=-24;k<=8;k++){ const i=nowIdx+k; if(i<0||i>=arr.length)continue; const val=arr[i]; if(val==null)continue; out.push({k,h:new Date(t[i]).getHours(),val,forecast:k>0}); } if(out.length>5)return out; } const out=[]; for(let k=-24;k<=8;k++){ const h=state.hour+k; let s=0; state.city.stations.forEach(st=>{const r=samplePM25(st,h,k>0?scen:null); s+=r.pm;}); out.push({k,h:((h%24)+24)%24,val:(s/state.city.stations.length)*POL_REL[pol],forecast:k>0}); } return out; }

are model output (CAMS ≈11 km) unless a WAQI ground reading is present.':'')+'</div>'; }
function liveNote(){ return '<div class="card pad" style="margin-top:14px"><div style="font-size:12.5px;color:var(--ink-2)">'+icon('info')+' <b>Live snapshot</b> ('+(state.dataSource||'live')+'). Values reflect the latest available hour for '+state.city.name+'. Source attribution and scenarios use assumed source shares layered on the live baseline.</div></div>'; }

/* ============================ HOTSPOTS ============================ */
function viewHotspots(){ const nodes=nodeValues(null).sort((a,b)=>b.value-a.value); const p=POLLUTANTS[state.pollutant]; const med=cityMedian(nodes); const rows=nodes.map((n,i)=>({n,i,dev:(n.value-med)/med*100})); return pageHead("Pollution hotspots","Where "+state.city.name+" is worst right now, versus the city median, with likely contributing factors shown as hypotheses.")+'<div class="card" style="overflow:hidden"><table class="tbl"><thead><tr><th>#</th><th>Location</th><th>Now ('+p.label+')</th><th>Band</th><th>vs city median</th><th>Likely factors (hypotheses)</th></tr></thead><tbody>'+rows.map(hotspotRow).join('')+'</tbody></table></div><div class="section-head"><h2>Automated read</h2></div><div class="card pad">'+hotspotInsights(rows,med)+'</div><div class="callout warn" style="margin-top:18px">'+icon('alert')+' Contributing factors are <b>generated hypotheses</b> from source mix, wind and context — not confirmed causes. Confirm with counts, inspection or source apportionment before acting.</div>'; }
function hotspotRow(r){ const n=r.n,b=bandForConc(state.pollutant,n.value,state.city.standard),devCol=r.dev>10?'var(--red)':r.dev<-10?'var(--green)':'var(--ink-3)',arrow=r.dev>5?icon('trend'):r.dev<-5?icon('down'):''; return '<tr><td><span class="rank" style="background:'+b.hex+'">'+(r.i+1)+'</span></td><td><b>'+n.st.name+'</b><div class="muted" style="font-size:11.5px">'+n.st.area+'</div></td><td style="font-weight:700;font-variant-numeric:tabular-nums">'+Math.round(n.value)+' <span class="muted" style="font-weight:400">'+POLLUTANTS[state.pollutant].unit+'</span></td><td><span class="pill '+b.cls+'">'+b.name+'</span></td><td style="color:'+devCol+';font-weight:600">'+arrow+' '+(r.dev>0?'+':'')+r.dev.toFixed(0)+'%</td><td style="font-size:12px">'+factorHyp(n)+'</td></tr>'; }
function factorHyp(n){ const c=n.comp,tot=c.traffic+c.industrial+c.construction+c.background,f=[]; if(c.traffic/tot>0.45)f.push("heavy traffic"); if(c.construction/tot>0.22)f.push("construction dust"); if(c.industrial/tot>0.25)f.push("industrial sources"); if(state.weather.windSpeed<7)f.push("low wind / poor dispersion"); if(state.dataMode==='sample'&&diurnalMul(state.hour)>1.2)f.push("peak-hour buildup"); if(!f.length)f.push("elevated background"); return f.map(x=>'<span class="pill tag-neutral" style="font-size:10.5px;margin:1px 2px">'+x+'</span>').join(''); }
function hotspotInsights(rows,med){ const worst=rows[0],clean=rows[rows.length-1],wd=degToCompass(state.weather.windDir); const trafficHeavy=rows.filter(r=>r.n.comp.traffic/(r.n.comp.traffic+r.n.comp.industrial+r.n.comp.construction+r.n.comp.background)>0.45).length; const out=[insight("target","Top hotspot",worst.n.st.name+" leads at "+Math.round(worst.n.value)+" "+POLLUTANTS[state.pollutant].unit+", "+(worst.dev>0?"about "+worst.dev.toFixed(0)+"% above the city median.":"around the city median."),"#FCE9E9","var(--red)"),insight("car","Dominant driver",trafficHeavy+" of "+rows.length+" points are traffic-dominated. Road-transport measures would have the broadest reach.","#FDF2E4","var(--orange)"),insight("wind","Weather context","Wind from the "+wd+" at "+state.weather.windSpeed+" km/h. "+(state.weather.windSpeed<7?"Low wind is limiting dispersion.":"Moderate wind is aiding dispersion downwind.")),insight("leaf","Cleanest area",clean.n.st.name+" is cleanest at "+Math.round(clean.n.value)+" "+POLLUTANTS[state.pollutant].unit+" — a useful control.","#E7F6EF","var(--green)")]; return out.map(o=>'<div class="insightbox"><div class="ib-ic" style="background:'+o.bg+';color:'+o.col+'">'+icon(o.ic)+'</div><div><div class="ib-t">'+o.t+'</div><div class="ib-b">'+o.b+'</div></div></div>').join(''); }
function insight(ic,t,b,bg,col){return{ic,t,b,bg:bg||"#F5EEFB",col:col||"var(--purple-deep)"};}

/* ============================ SCENARIO ============================ */
function viewScenario(){ const sc=state.scenario,p=POLLUTANTS[state.pollutant]; const baseNodes=nodeValues(null),scenNodes=nodeValues(sc),baseAvg=cityAvg(baseNodes),scenAvg=cityAvg(scenNodes),delta=scenAvg-baseAvg,pct=delta/baseAvg*100; const recRows=state.city.receptors.map(r=>{const b=sampleAt(r.lat,r.lon,baseNodes,null),s=sampleAt(r.lat,r.lon,scenNodes,sc);return{r,b,s,d:s-b};}); return pageHead("Scenario Lab","Test an intervention against "+(state.dataMode==='live'?"the live baseline":"today's sample baseline")+" for "+state.city.name+". Directional demonstrator, not a validated dispersion model.")+'<div class="scenlayout"><div class="card pad"><h3 style="margin-bottom:14px">Intervention levers</h3>'+slider("traffic","Traffic reduction",sc.traffic,0,80,"%","Cut vehicle volumes")+slider("ebus","Electric bus penetration",sc.ebus,0,100,"%","Share of buses electrified")+slider("construction","Construction dust control",sc.construction,0,90,"%","Suppression, covering, wheel-wash")+slider("industrial","Industrial emission control",sc.industrial,0,80,"%","Scrubbers, cleaner fuel")+'<div class="field" style="margin:16px 0 10px"><label style="display:flex;align-items:center;gap:9px;cursor:pointer;font-size:13.5px"><input type="checkbox" data-act="lez" '+(sc.lez?'checked':'')+' style="width:16px;height:16px;accent-color:var(--purple)"/> Low-emission zone (−40% traffic)</label></div><div class="divider"></div><h4 style="font-size:13px;margin-bottom:10px">Weather sensitivity</h4>'+slider("windSpeed","Wind speed",sc.windSpeed,0,30,"km/h","Higher wind disperses pollution")+sliderWind("windDir","Wind direction",sc.windDir)+'<div class="btnrow" style="margin-top:16px"><button class="btn primary" data-act="applyscen">'+icon('rocket')+'Run scenario</button><button class="btn" data-act="resetscen">Reset</button></div></div><div><div class="kpis" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px">'+kpi("Baseline avg",baseAvg.toFixed(0)+' '+p.unit,state.dataMode==='live'?(state.dataSource||'live'):'sample',bandForConc(state.pollutant,baseAvg,state.city.standard).hex)+kpi("Scenario avg",scenAvg.toFixed(0)+' '+p.unit,"modelled",bandForConc(state.pollutant,scenAvg,state.city.standard).hex)+kpi("Change",(delta>0?'+':'')+delta.toFixed(0)+' '+p.unit,(pct>0?'+':'')+pct.toFixed(1)+'%',delta<0?'var(--green)':delta>0?'var(--red)':'var(--ink-3)')+'</div><div class="card pad"><div class="dualmap"><div><div class="dm-title">'+icon('map')+'Baseline</div>'+renderMap(null,{scope:'base',controls:false,gx:28,gy:24})+'</div><div><div class="dm-title">'+icon('beaker')+'Scenario</div>'+renderMap(sc,{scope:'scen',controls:false,gx:28,gy:24})+'</div></div>'+mapLegend()+'</div><div class="section-head" style="margin:22px 0 12px"><h2>Exposure at sensitive locations</h2><div class="d">Modelled '+p.label+' — baseline vs scenario</div></div><div class="card" style="overflow:hidden"><table class="tbl"><thead><tr><th>Location</th><th>Type</th><th>Baseline</th><th>Scenario</th><th>Change</th></tr></thead><tbody>'+recRows.map(rr=>'<tr><td><b>'+rr.r.name+'</b></td><td><span class="pill tag-neutral" style="font-size:10.5px">'+icon(rr.r.type==='hospital'?'shield':'school')+rr.r.type+'</span></td><td style="font-variant-numeric:tabular-nums">'+Math.round(rr.b)+'</td><td style="font-variant-numeric:tabular-nums;font-weight:700;color:'+bandForConc(state.pollutant,rr.s,state.city.standard).hex+'">'+Math.round(rr.s)+'</td><td style="color:'+(rr.d<0?'var(--green)':rr.d>0?'var(--red)':'var(--ink-3)')+';font-weight:600">'+(rr.d>0?'+':'')+rr.d.toFixed(0)+' '+p.unit+'</td></tr>').join('')+'</tbody></table></div></div></div><div class="section-head"><h2>Scenario read</h2></div><div class="card pad">'+scenInsights(baseAvg,scenAvg,recRows,sc)+'</div><div class="callout warn" style="margin-top:18px">'+icon('alert')+' Effects are estimated by scaling assumed source components and re-interpolating'+(state.dataMode==='live'?', layered on live concentrations':'')+'. Directional planning aid — commission a calibrated dispersion study before committing capital.</div>'; }
function slider(k,l,v,mn,mx,u,h){ return '<div class="slider-field"><div class="sl-top"><label>'+l+'</label><span class="sl-val">'+v+' '+u+'</span></div><input type="range" min="'+mn+'" max="'+mx+'" value="'+v+'" data-act="scen" data-key="'+k+'"/><div class="sl-hint">'+h+'</div></div>'; }
function sliderWind(k,l,v){ return '<div class="slider-field"><div class="sl-top"><label>'+l+'</label><span class="sl-val">'+degToCompass(v)+' ('+v+'°)</span></div><input type="range" min="0" max="359" step="5" value="'+v+'" data-act="scen" data-key="'+k+'"/><div class="sl-hint">Direction the wind blows from</div></div>'; }
function scenInsights(baseAvg,scenAvg,recRows,sc){ const delta=scenAvg-baseAvg,pct=delta/baseAvg*100,active=[]; if(sc.traffic)active.push(sc.traffic+"% traffic cut"); if(sc.ebus)active.push(sc.ebus+"% e-bus"); if(sc.construction)active.push(sc.construction+"% dust control"); if(sc.industrial)active.push(sc.industrial+"% industrial control"); if(sc.lez)active.push("low-emission zone"); const out=[insight(delta<0?"down":"trend","Net effect",active.length?("Combined intervention ("+active.join(", ")+") shifts the city average by "+(pct>0?'+':'')+pct.toFixed(1)+"% — "+(delta<-1?"a meaningful improvement":delta<0?"a modest improvement":"little change")+"."):"No levers set — move a slider to model an intervention.",delta<0?"#E7F6EF":"#F5EEFB",delta<0?"var(--green)":"var(--purple-deep)")]; if(active.length){ const best=recRows.slice().sort((a,b)=>a.d-b.d)[0]; out.push(insight("school","Sensitive locations","Largest reduction is at "+best.r.name+" ("+best.d.toFixed(0)+" "+POLLUTANTS[state.pollutant].unit+"). Prioritising near schools/hospitals maximises health benefit.")); } const wv=windVector(sc); out.push(insight("wind","Wind sensitivity","At "+wv.spd+" km/h from the "+degToCompass(sc.windDir)+", pollution is carried toward the "+degToCompass((sc.windDir+180)%360)+". Downwind areas inherit upwind emissions.")); return out.map(o=>'<div class="insightbox"><div class="ib-ic" style="background:'+o.bg+';color:'+o.col+'">'+icon(o.ic)+'</div><div><div class="ib-t">'+o.t+'</div><div class="ib-b">'+o.b+'</div></div></div>').join(''); }

/* ============================ FORECAST ============================ */
function viewForecast(){ const series=citySeries(state.scenario),p=POLLUTANTS[state.pollutant],alerts=buildAlerts(); const isLive=state.dataMode==='live'&&state.live&&state.live.series; return pageHead("Forecast & alerts","A short-horizon outlook for "+state.city.name+" and a watchlist of hotspots and exposed locations.")+'<div class="card pad"><h3 style="margin-bottom:4px">City '+p.label+' — last 24h and next 8h</h3><div class="muted" style="font-size:12px;margin-bottom:6px">Solid = recent, dashed = forecast. '+(isLive?'<b>Live forecast</b> for the city centre.':'Sample diurnal projection.')+'</div><div class="chart-wrap">'+forecastChart(series)+'</div><div class="legend"><span><i style="background:var(--purple)"></i>Recent</span><span><i style="background:var(--blue)"></i>Forecast</span></div></div><div class="section-head"><h2>Alert watchlist</h2><div class="d">Auto-generated from current levels, forecast direction and sensitive-location exposure</div></div><div class="card pad">'+(alerts.length?alerts.map(alertRow).join(''):'<p class="muted">No active alerts — all monitored areas within acceptable bands.</p>')+'</div><div class="callout info" style="margin-top:18px">'+icon('info')+' In a live deployment these thresholds map to operator playbooks — school advisories, traffic-management triggers, construction-halt notices — each retaining human approval.</div>'; }
function forecastChart(series){ const W=760,H=260,padL=42,padR=16,padT=16,padB=34; if(!series.length)return'<p class="muted">No series available.</p>'; const vals=series.map(s=>s.val),vmax=Math.max(...vals)*1.15||1; const x=i=>padL+(i/(series.length-1))*(W-padL-padR),y=v=>H-padB-(v/vmax)*(H-padT-padB); let grid=''; for(let g=0;g<=4;g++){const vv=vmax*g/4,yy=y(vv);grid+='<line x1="'+padL+'" y1="'+yy+'" x2="'+(W-padR)+'" y2="'+yy+'" stroke="#EFECF4"/><text x="'+(padL-6)+'" y="'+(yy+3)+'" font-size="9" fill="#6B6480" text-anchor="end">'+Math.round(vv)+'</text>';} const recent=series.filter(s=>!s.forecast),fc=series.filter(s=>s.forecast),idxNow=recent.length-1; const recentPath=recent.map((s,i)=>((i===0?'M':'L')+x(i)+' '+y(s.val).toFixed(1))).join(' '); const fcPath=fc.length?('M'+x(idxNow)+' '+y(recent[idxNow].val).toFixed(1)+' '+fc.map((s,i)=>('L'+x(idxNow+1+i)+' '+y(s.val).toFixed(1))).join(' ')):''; let xlab=''; series.forEach((s,i)=>{if(i%6===0)xlab+='<text x="'+x(i)+'" y="'+(H-padB+16)+'" font-size="9" fill="#6B6480" text-anchor="middle">'+String(s.h).padStart(2,'0')+'h</text>';}); const nowX=x(idxNow); return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:'+W+'px">'+grid+'<line x1="'+nowX+'" y1="'+padT+'" x2="'+nowX+'" y2="'+(H-padB)+'" stroke="#DED9E8" stroke-dasharray="3 3"/><text x="'+nowX+'" y="'+(padT+2)+'" font-size="9" fill="#6B6480" text-anchor="middle">now</text><path d="'+recentPath+'" fill="none" stroke="#A100FF" stroke-width="2.2"/>'+(fcPath?'<path d="'+fcPath+'" fill="none" stroke="#1466E0" stroke-width="2.2" stroke-dasharray="5 4"/>':'')+xlab+'</svg>'; }
function buildAlerts(){ const nodes=nodeValues(null),std=state.city.standard,alerts=[]; nodes.forEach(n=>{const bd=bandForConc(state.pollutant,n.value,std); if(bd.idx>=3)alerts.push({sev:RAMP[bd.idx],t:bd.name+" air at "+n.st.name,d:Math.round(n.value)+" "+POLLUTANTS[state.pollutant].unit+" ("+bd.name+"). Consider advisories for sensitive groups nearby."});}); state.city.receptors.forEach(r=>{const v=sampleAt(r.lat,r.lon,nodes,null),bd=bandForConc(state.pollutant,v,std); if(bd.idx>=2)alerts.push({sev:RAMP[bd.idx],t:"Elevated exposure — "+r.name,d:"Modelled "+Math.round(v)+" "+POLLUTANTS[state.pollutant].unit+" ("+bd.name+") at this "+r.type+". Notify site; consider limiting outdoor activity."});}); const series=citySeries(null),now=series.find(s=>s.k===0),soon=series.find(s=>s.k===6); if(now&&soon&&soon.val>now.val*1.12)alerts.push({sev:RAMP[2],t:"Rising trend expected",d:"City average forecast to rise ~"+Math.round((soon.val/now.val-1)*100)+"% over the next 6 hours. Pre-position response."}); return alerts.slice(0,8); }
function alertRow(a){ return '<div class="alertrow"><div class="al-sev" style="background:'+a.sev+'"></div><div><div class="al-t">'+a.t+'</div><div class="al-d">'+a.d+'</div></div></div>'; }

/* ============================ BRIEF ============================ */
function viewBrief(){ const nodes=nodeValues(null).sort((a,b)=>b.value-a.value),sc=state.scenario,scenNodes=nodeValues(sc),baseAvg=cityAvg(nodes),scenAvg=cityAvg(scenNodes),delta=scenAvg-baseAvg,pct=delta/baseAvg*100,p=POLLUTANTS[state.pollutant],worst=nodes.slice(0,3); const active=[]; if(sc.traffic)active.push(sc.traffic+"% traffic cut"); if(sc.ebus)active.push(sc.ebus+"% e-bus"); if(sc.construction)active.push(sc.construction+"% dust control"); if(sc.industrial)active.push(sc.industrial+"% industrial control"); if(sc.lez)active.push("low-emission zone"); const recRows=state.city.receptors.map(r=>({r,b:sampleAt(r.lat,r.lon,nodes,null),s:sampleAt(r.lat,r.lon,scenNodes,sc)})); const srcLabel=state.dataMode==='live'?(state.dataSource||'live'):'sample data'; return '<div class="btnrow no-print" style="justify-content:flex-end;margin-bottom:16px"><button class="btn" data-act="print">'+icon('print')+'Print / Save as PDF</button><button class="btn" data-act="exportjson">'+icon('download')+'Export configuration</button></div><div class="brief-sheet"><div class="brief-head"><div><span class="pill '+(state.dataMode==='live'?'tag-live':'tag-demo')+'" style="margin-bottom:6px">'+(state.dataMode==='live'?'● '+srcLabel:'◆ Sample data')+' · directional</span><br><div class="eyebrow">Urban Environment Twin — Air Quality</div><h1 style="font-size:24px;margin-top:6px">'+state.city.flag+' '+state.city.name+' — decision brief</h1><div class="muted" style="font-size:12.5px;margin-top:4px">'+p.name+' ('+p.label+') · '+standardName(state.city.standard)+' · wind '+degToCompass(state.weather.windDir)+' '+state.weather.windSpeed+' km/h</div></div><div style="text-align:right">'+LOGO+'<div style="font-size:10px;color:var(--ink-3);margin-top:4px">CiTI Practice</div></div></div><div class="kpis" style="margin-bottom:22px">'+kpi("City average",baseAvg.toFixed(0)+' '+p.unit,bandForConc(state.pollutant,baseAvg,state.city.standard).name,bandForConc(state.pollutant,baseAvg,state.city.standard).hex)+kpi("Worst hotspot",Math.round(worst[0].value)+' '+p.unit,worst[0].st.name,bandForConc(state.pollutant,worst[0].value,state.city.standard).hex)+kpi("Tested scenario",active.length?((pct>0?'+':'')+pct.toFixed(1)+'%'):'—',active.length?'vs baseline':'no levers set',delta<0?'var(--green)':'var(--ink-3)')+kpi("Sensitive sites",state.city.receptors.length,"tracked","var(--blue)")+'</div><div class="card" style="padding:12px;margin-bottom:22px;box-shadow:none">'+renderMap(null,{controls:false,gx:30,gy:26})+mapLegend()+'</div><div class="brief-cols"><div class="brief-block"><h4>Current condition</h4><ul><li>City average '+baseAvg.toFixed(0)+' '+p.unit+' — '+bandForConc(state.pollutant,baseAvg,state.city.standard).name+'.</li><li>Worst three: '+worst.map(w=>w.st.name+' ('+Math.round(w.value)+')').join(', ')+'.</li><li>Wind '+degToCompass(state.weather.windDir)+' at '+state.weather.windSpeed+' km/h — '+(state.weather.windSpeed<7?'poor dispersion':'moderate dispersion')+'.</li></ul><h4 style="margin-top:16px">Priority hotspots</h4><ul>'+worst.map(w=>'<li>'+w.st.name+' — '+w.st.area+'</li>').join('')+'</ul></div><div class="brief-block"><h4>Tested intervention</h4><ul>'+(active.length?active.map(a=>'<li>'+a+'</li>').join(''):'<li class="muted">No intervention modelled yet — set levers in the Scenario Lab.</li>')+'</ul>'+(active.length?'<div style="font-size:13px;margin-top:6px"><b>Estimated effect:</b> city average '+(pct>0?'+':'')+pct.toFixed(1)+'% ('+(delta>0?'+':'')+delta.toFixed(0)+' '+p.unit+').</div>':'')+'<h4 style="margin-top:16px">Exposure at sensitive sites</h4><ul>'+recRows.map(rr=>'<li>'+rr.r.name+': '+Math.round(rr.b)+(active.length?' → '+Math.round(rr.s):'')+' '+p.unit+'</li>').join('')+'</ul></div></div><div class="divider"></div><div class="brief-cols"><div class="brief-block"><h4>Recommended next analysis</h4><ul><li>Confirm the top hotspot with traffic counts and a site inspection.</li><li>Validate the leading scenario with a calibrated dispersion model.</li><li>Add low-cost sensors where station coverage is thin.</li><li>Map exposed schools/hospitals to an operator playbook.</li></ul></div><div class="brief-block"><h4>Facilitator notes</h4><textarea class="inp no-print" data-act="notes" style="min-height:90px" placeholder="Add workshop notes...">'+esc(state.notes)+'</textarea></div></div><div class="qualify">'+icon('info')+' '+(state.dataMode==='live'?'Live values are model output (CAMS ≈11 km) via the data agent / Open-Meteo, optionally enriched by WAQI ground sensors. ':'Illustrative sample data. ')+'Concentrations between points are interpolated; scenario effects are estimated by scaling assumed source shares. Not a validated dispersion study, not health advice, not a substitute for regulatory monitoring.</div></div>'; }

/* ============================ REGISTER ============================ */
function viewRegister(){ return pageHead("Data & model register","Provenance and method transparency — every value should be traceable to a source, a timestamp and a method.")+'<div class="card pad" style="margin-bottom:18px"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><div><div style="font-size:14px;font-weight:600">Current data mode</div><div class="muted" style="font-size:12.5px">'+(state.dataMode==='live'?('Live · source: '+(state.dataSource||'live')+' for '+state.city.name):('Sample data (live unavailable'+(state.liveError?': '+esc(state.liveError):'')+')'))+'</div></div>'+dataBadge()+'</div></div><div class="section-head" style="margin-top:6px"><h2>Data sources (priority order)</h2></div><div class="card pad">'+regSrc("database","1 · Data agent (GitHub Actions)","Reads pre-fetched JSON from "+AGENT_DATA_DIR+"/&lt;city&gt;.json — published on a schedule. Can include WAQI ground-sensor readings when a token is configured.",(state.dataSource&&state.dataSource.indexOf('agent')>=0)?"● ACTIVE":"Preferred")+regSrc("wind","2 · Open-Meteo (direct)","Browser calls the Copernicus CAMS model + weather directly when the agent file is missing. No key, CORS-enabled.",(state.dataSource==='open-meteo')?"● ACTIVE":"Fallback")+regSrc("activity","3 · Sample data","Built-in illustrative values so the app always works offline / on a corporate network.",(state.dataMode==='sample')?"● ACTIVE":"Last resort")+'</div><div class="section-head"><h2>Layer status</h2></div><div class="card" style="overflow:hidden"><table class="tbl"><thead><tr><th>Layer</th><th>Source</th><th>Mode</th><th>Basis</th><th>Quality flag</th></tr></thead><tbody>'+regRow("Point concentrations",(state.dataSource||"sample"),state.dataMode==='live',state.dataMode==='live'?'live':'sample',state.dataMode==='live'?((state.dataSource||'').indexOf('waqi')>=0?'Sensor+model':'Model (11km)'):'Illustrative')+regRow("Interpolated surface","Model (IDW + wind)",false,"derived","Estimate")+regRow("Wind & weather",(state.dataMode==='live'?'agent/open-meteo':'assumed'),state.dataMode==='live',state.dataMode==='live'?'live':'assumed',state.dataMode==='live'?'Observed/model':'Assumed')+regRow("Scenario outputs","Model",false,"derived","Directional")+regRow("Sensitive receptors","Open data / manual",false,"static","Reference")+'</tbody></table></div><div class="section-head"><h2>Method transparency</h2></div><div class="card pad"><details class="calc" open><summary>How the pollution surface is built</summary><div style="font-size:13px;color:var(--ink-2);padding:8px 0;line-height:1.7">1. Each point reports a concentration ('+(state.dataMode==='live'?('live from '+(state.dataSource||'source')):'sample')+').<br>2. Points are advected slightly downwind by wind direction/speed.<br>3. A grid is filled by <b>inverse-distance weighting</b>.<br>4. Overall dispersion scales with wind speed.<br>5. Each cell is coloured by its '+standardName(state.city.standard)+' band.</div></details><details class="calc"><summary>How the data agent works</summary><div style="font-size:13px;color:var(--ink-2);padding:8px 0;line-height:1.7">A scheduled GitHub Action runs a small Node script that fetches Open-Meteo (and optionally WAQI), then commits <span class="mono">data/&lt;city&gt;.json</span>. This app reads those static files from the same origin — no keys in the browser, no CORS issues, instant load. If a file is missing it falls back to calling Open-Meteo directly, then to sample data.</div></details><details class="calc"><summary>AQI standards</summary><div style="font-size:13px;color:var(--ink-2);padding:8px 0;line-height:1.7">Indian cities use India NAQI breakpoints; all other cities use EEA European AQI bands as an international reference.</div></details></div><div class="callout warn" style="margin-top:18px">'+icon('shield')+' <b>Guardrails:</b> live values are model estimates (unless a WAQI sensor value is present); interpolated/scenario values are never shown as measured; every layer carries a basis and quality flag; operational recommendations retain human approval.</div>'; }
function regSrc(ic,t,d,status){ return '<div class="reg-src"><div class="rs-ic">'+icon(ic)+'</div><div style="flex:1"><div class="rs-t">'+t+'</div><div class="rs-d">'+d+'</div></div><div><span class="pill '+(status.indexOf('ACTIVE')>=0?'tag-live':'tag-neutral')+'" style="font-size:10.5px">'+status+'</span></div></div>'; }
function regRow(layer,src,live,basis,flag){ return '<tr><td><b>'+layer+'</b></td><td>'+src+'</td><td><span class="pill '+(live?'tag-live':'tag-demo')+'" style="font-size:10.5px">'+(live?'live':'model/sample')+'</span></td><td class="muted" style="font-size:12px">'+basis+'</td><td><span class="pill tag-neutral" style="font-size:10.5px">'+flag+'</span></td></tr>'; }

/* ============================ UTIL + EVENTS ============================ */
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg,type){ const t=document.getElementById('toast'); document.getElementById('toast-msg').textContent=msg; t.querySelector('.dot').style.background=type==='warn'?'var(--orange)':type==='error'?'var(--red)':'var(--green)'; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2600); }
function download(fn,c,m){ const b=new Blob([c],{type:m||'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a'); a.href=u; a.download=fn; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1200); }
async function selectCity(id){ if(!CITIES[id])return; const city=JSON.parse(JSON.stringify(CITIES[id])); city.bbox=cityBBox(city); state.city=city; state.cityId=id; state.selectedStation=null; state.scenario={traffic:0,construction:0,industrial:0,lez:false,ebus:0,windDir:state.weather.windDir,windSpeed:state.weather.windSpeed}; state.screen="loading"; render(); const ok=await loadLiveData(city); state.hour=new Date().getHours(); state.screen="live"; render(); toast(ok?("Loaded "+city.name+" — "+(state.dataSource||'live')):("Live unavailable — sample data for "+city.name), ok?"ok":"warn"); }
let _wired=false;
function wire(){ wireTooltips(); if(_wired)return; _wired=true; document.addEventListener('click',onClick); document.addEventListener('input',onInput,true); document.addEventListener('change',onChange,true); }
function onClick(e){ const sd=e.target.closest('.stationdot'); if(sd){ state.selectedStation=state.selectedStation===sd.dataset.station?null:sd.dataset.station; if(state.screen!=='live')state.screen='live'; render(); return; } const t=e.target.closest('[data-act]'); if(!t)return; const act=t.dataset.act; switch(act){ case"selcity": selectCity(t.dataset.id); break; case"jumpgo": { const sel=document.getElementById('cityJump'); if(sel&&sel.value)selectCity(sel.value); break; } case"home": state.screen="selector"; render(); break; case"nav": state.screen=t.dataset.screen; window.scrollTo(0,0); render(); break; case"pol": state.pollutant=t.dataset.p; render(); break; case"refresh": state.screen="loading"; render(); loadLiveData(state.city).then(ok=>{state.hour=new Date().getHours();state.screen="live";render();toast(ok?("Refreshed — "+(state.dataSource||'live')):"Still unavailable — sample data",ok?"ok":"warn");}); break; case"toggle": state[t.dataset.t]=!state[t.dataset.t]; render(); break; case"selstation": state.selectedStation=state.selectedStation===t.dataset.station?null:t.dataset.station; render(); break; case"lez": state.scenario.lez=!state.scenario.lez; render(); break; case"applyscen": render(); toast("Scenario updated"); break; case"resetscen": state.scenario={traffic:0,construction:0,industrial:0,lez:false,ebus:0,windDir:state.weather.windDir,windSpeed:state.weather.windSpeed}; render(); toast("Scenario reset"); break; case"print": window.print(); break; case"exportjson": exportConfig(); break; } }
function onChange(e){ const t=e.target.closest('[data-act]'); if(!t)return; if(t.dataset.act==='jump'){ if(t.value)selectCity(t.value); } }
function onInput(e){ const t=e.target.closest('[data-act]'); if(!t)return; if(t.dataset.act==='hour'){ state.hour=+t.value; render(); } else if(t.dataset.act==='scen'){ state.scenario[t.dataset.key]=+t.value; const lab=t.closest('.slider-field').querySelector('.sl-val'); if(lab){ if(t.dataset.key==='windDir')lab.textContent=degToCompass(+t.value)+' ('+t.value+'°)'; else lab.textContent=t.value+' '+(t.dataset.key==='windSpeed'?'km/h':'%'); } scheduleScen(); } else if(t.dataset.act==='notes'){ state.notes=t.value; } }
let _srT=null; function scheduleScen(){ clearTimeout(_srT); _srT=setTimeout(()=>render(),140); }
function exportConfig(){ const cfg={version:"v3",city:state.city.name,country:state.city.country,dataMode:state.dataMode,dataSource:state.dataSource,standard:state.city.standard,pollutant:state.pollutant,weather:state.weather,scenario:state.scenario,notes:state.notes,liveFetchedAt:state.live?new Date(state.live.fetchedAt).toISOString():null,exportedAt:new Date().toISOString(),note:"Urban Environment Twin — Air Quality v3"}; download((state.city.name||'city').toLowerCase().replace(/\s+/g,'_')+"_air_twin_v3_config.json",JSON.stringify(cfg,null,2)); toast("Configuration exported"); }
function wireTooltips(){ document.querySelectorAll('.mapwrap').forEach(wrap=>{ const scope=wrap.dataset.mapscope,tt=wrap.querySelector('.tooltip'); if(!tt)return; wrap.querySelectorAll('.stationdot').forEach(dot=>{ dot.addEventListener('mousemove',ev=>{ const st=state.city.stations.find(s=>s.id===dot.dataset.station); if(!st)return; const scen=(scope==='scen')?state.scenario:null; const node=nodeValues(scen).find(n=>n.st.id===st.id); const b=bandForConc(state.pollutant,node.value,state.city.standard); const r=wrap.getBoundingClientRect(); tt.innerHTML='<b>'+st.name+'</b><br>'+st.area+'<br>'+POLLUTANTS[state.pollutant].label+': <b>'+Math.round(node.value)+' '+POLLUTANTS[state.pollutant].unit+'</b><br><span style="color:'+b.hex+'">'+b.name+'</span>'; let x=ev.clientX-r.left+12,y=ev.clientY-r.top+12; if(x>r.width-190)x=ev.clientX-r.left-180; tt.style.left=x+'px'; tt.style.top=y+'px'; tt.style.opacity=1; }); dot.addEventListener('mouseleave',()=>{tt.style.opacity=0;}); }); }); }

render();
</script>
