name: Refresh air-quality data
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
  push:
    branches: [ main ]
permissions:
  contents: write
concurrency:
  group: refresh-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run data agent
        env:
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
        run: node scripts/fetch-air.mjs
      - name: Commit updated data
        run: |
          git config user.name  "air-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          if git diff --staged --quiet; then echo "No data changes."; else git commit -m "chore: refresh air-quality data [skip ci]"; git push; fi
